name: Build my game APK

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/velgame/mobile

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'VelGame'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.velgame.mobile'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.velgame.mobile'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Vel Game"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/velgame/mobile/MainActivity.java <<'EOF'
          package com.velgame.mobile;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String GAME_URL = "https://vel.gg/bo1z";

              private WebView web;
              private FrameLayout root;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private AlertDialog errorDialog;

              @Override
              public void onCreate(Bundle savedState) {
                  super.onCreate(savedState);

                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  setContentView(root);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(
                      WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  );

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request
                      ) {
                          return handleLink(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, String url
                      ) {
                          return handleLink(Uri.parse(url));
                      }

                      @Override
                      public void onReceivedError(
                          WebView view,
                          WebResourceRequest request,
                          WebResourceError error
                      ) {
                          if (request.isForMainFrame()) {
                              showLoadError();
                          }
                      }

                      @Override
                      public void onReceivedHttpError(
                          WebView view,
                          WebResourceRequest request,
                          WebResourceResponse response
                      ) {
                          if (request.isForMainFrame()
                              && response.getStatusCode() >= 400) {
                              showLoadError();
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(
                          View view, CustomViewCallback callback
                      ) {
                          if (fullscreenView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          fullscreenView = view;
                          fullscreenCallback = callback;
                          root.addView(
                              view, new FrameLayout.LayoutParams(-1, -1)
                          );
                          web.setVisibility(View.GONE);
                          enterFullscreen();
                      }

                      @Override
                      public void onHideCustomView() {
                          closeFullscreenVideo();
                      }
                  });

                  if (savedState == null
                      || web.restoreState(savedState) == null) {
                      web.loadUrl(GAME_URL);
                  }

                  enterFullscreen();
              }

              private boolean handleLink(Uri uri) {
                  String scheme = uri.getScheme();
                  if ("https".equalsIgnoreCase(scheme)) {
                      return false;
                  }
                  if ("http".equalsIgnoreCase(scheme)) {
                      openBrowser(uri);
                  }
                  return true;
              }

              private void openBrowser(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException error) {
                      Toast.makeText(
                          this, "No browser installed", Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void showLoadError() {
                  if (isFinishing() || isDestroyed()) {
                      return;
                  }
                  if (errorDialog != null && errorDialog.isShowing()) {
                      return;
                  }
                  errorDialog = new AlertDialog.Builder(this)
                      .setTitle("Could not load the game")
                      .setMessage(
                          "Check your internet connection and try again."
                      )
                      .setPositiveButton("Retry", (dialog, which) -> {
                          web.loadUrl(GAME_URL);
                      })
                      .setNeutralButton("Open in browser", (dialog, which) -> {
                          openBrowser(Uri.parse(GAME_URL));
                      })
                      .setNegativeButton("Close", (dialog, which) -> finish())
                      .create();
                  errorDialog.show();
              }

              private void enterFullscreen() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              private void closeFullscreenVideo() {
                  if (fullscreenView == null) {
                      return;
                  }
                  root.removeView(fullscreenView);
                  fullscreenView = null;
                  web.setVisibility(View.VISIBLE);
                  WebChromeClient.CustomViewCallback callback =
                      fullscreenCallback;
                  fullscreenCallback = null;
                  if (callback != null) {
                      callback.onCustomViewHidden();
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enterFullscreen();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle state) {
                  web.saveState(state);
                  super.onSaveInstanceState(state);
              }

              @Override
              protected void onPause() {
                  if (web != null) {
                      web.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) {
                      web.onResume();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (fullscreenView != null) {
                      closeFullscreenVideo();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (errorDialog != null) {
                      errorDialog.dismiss();
                  }
                  closeFullscreenVideo();
                  if (web != null) {
                      root.removeView(web);
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vel-Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
